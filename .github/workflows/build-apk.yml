name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Android SDK 36 & licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install Node dependencies
        run: npm ci

      - name: Build web bundle (Vite + Phaser)
        run: npm run build

      - name: Sync web bundle to Android (Capacitor)
        run: node ./node_modules/@capacitor/cli/bin/capacitor sync android

      - name: Ensure gradlew is executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Verify APK output
        id: verify-apk
        run: |
          APK_PATH=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ] || [ ! -f "$APK_PATH" ]; then
            echo "ERROR: Debug APK not found!"
            exit 1
          fi
          APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"
          echo "apk_size=$APK_SIZE" >> "$GITHUB_OUTPUT"
          echo "Found Debug APK: $APK_PATH ($APK_SIZE)"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: everroot-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Write Build Status Summary
        if: always()
        run: |
          {
            echo "## Everroot Android Debug APK Build"
            echo ""
            echo "- **Status**: ${{ job.status }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **APK Path**: ${{ steps.verify-apk.outputs.apk_path || 'N/A' }}"
            echo "- **APK Size**: ${{ steps.verify-apk.outputs.apk_size || 'N/A' }}"
          } >> "$GITHUB_STEP_SUMMARY"
